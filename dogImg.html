<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dogs Image</title>
    <!-- style the page -->
    <style>
      * {
        text-align: center;
        padding: 4px;
        margin: 4px;
        border-radius: 10px;
        overflow: auto;
        user-select: none;
      }

      h1 {
        color: blue;
      }

      img {
        height: 300px;
        width: 400px;
        border: 3px solid red;
      }

      button {
        margin-top: 3px;
        padding: 3px;
        color: aqua;
        background-color: red;
        height: 50px;
        width: 150px;
        cursor: pointer;
        align-items: center;
        font-size: 23px;
      }

      button:hover {
        color: rgb(255, 0, 0);
        background-color: aqua;
        height: 55px;
        width: 170px;
      }
    </style>
  </head>
  <body>
    <a href="./index.html">
      <button>🏠Home</button>
    </a>

    <h1>Get Random Dogs 🐶 Picture ⬇️</h1>
    <button id="get-random-dog-btn">Get Dogs Pic</button>
    <br />
    <img
      id="dog-img"
      src="https://image.lexica.art/full_webp/0c0b2d8d-583e-4663-87eb-702815764816"
      alt="Cute Dog Pic"
    />

    <!-- javascript code start -->
    <script>
      //select all necessary elements
      const getDogBtn = document.getElementById("get-random-dog-btn");
      const dogImg = document.getElementById("dog-img");

      //function to generate random dog image
      // dog.ceo always returns a JPEG (random.dog sometimes returns .mp4/.webm,
      // which an <img> can't show).
      const generateDogImage = async () => {
        try {
          const res = await fetch("https://dog.ceo/api/breeds/image/random");
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const result = await res.json();
          const url = new URL(result.message);
          if (url.protocol === "https:" && url.hostname === "images.dog.ceo") {
            dogImg.src = url.href;
          }
        } catch (err) {
          console.error("dog:", err);
        }
      };

      //generate A dog image when User click on button
      getDogBtn.addEventListener("click", generateDogImage);

      //Random Dog Image after Specific Interval(here 9 seconds)
      setInterval(() => { if (!document.hidden) generateDogImage(); }, 9000);

      //generateDogImage();
    </script>
  </body>
</html>
