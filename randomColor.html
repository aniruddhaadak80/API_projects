<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Color</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <style>
      * {
        text-align: center;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <nav><a href="./index.html"><button type="button">🏠Home</button></a></nav>
    <h1 id="random-color-h1">Get Random Color</h1>
    <br />
    <button id="random-color-Btn" type="button">Get Random Color</button>
    <p id="color-code" aria-live="polite"></p>

    <!-- Script i.e javascript Source  -->
    <script>
      //select all elements by ID
      const randomColorH1 = document.getElementById("random-color-h1");
      const randomColorBtn = document.getElementById("random-color-Btn");

      const colorCode = document.getElementById("color-code");

      const generateRandomColor = async () => {
        try {
          const res = await fetch("https://x-colors.yurace.pro/api/random");
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const result = await res.json();
          randomColorH1.style.color = result.rgb;
          randomColorBtn.style.color = result.rgb;
          colorCode.textContent = `${result.hex} · ${result.rgb}`;
        } catch (err) {
          colorCode.textContent = "Couldn't reach the color API. Try again.";
          console.error("colors:", err);
        }
      };
      randomColorBtn.addEventListener("click", generateRandomColor);
      generateRandomColor();
      // auto-refresh every 3 s while the tab is visible
      setInterval(() => { if (!document.hidden) generateRandomColor(); }, 3000);
    </script>
  </body>
</html>
